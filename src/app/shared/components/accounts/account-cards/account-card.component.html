<div class="flex overflow-x-auto snap-x snap-mandatory gap-5">

  @for (account of accounts; track account.accountId) {

  <div class="snap-start min-w-[280px] md:min-w-[280px] rounded-2xl border border-gray-200 bg-white p-5 md:p-6">

    <div class="flex items-center justify-center w-12 h-12 bg-gray-100 rounded-xl">
      <span [innerHTML]="icons.cash | safeHtml"></span>
    </div>

    <div class="flex items-end justify-between mt-5">
      <div>
        <span class="text-sm text-gray-700">
          {{ account.name }}
        </span>
        <h4 class="mt-2 font-bold text-gray-800">
          $ {{ account.balance}}
        </h4>
      </div>

      <app-badge>
        {{ account.type }}
      </app-badge>

    </div>
  </div>

  }

</div>
